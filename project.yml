name: Must
options:
  bundleIdPrefix: dev.viniso
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: pt-BR
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 7.0.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: BS5ZUHVH99
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  Must:
    type: application
    platform: iOS
    sources:
      - path: Must
        excludes:
          - "Widgets/**"
          - "Resources/Fonts/licenses/**"
          - "DesignSystem/MapStyle/**"
          - "ShareExtension/**"
      - path: Must/DesignSystem/MapStyle
        type: folder
        buildPhase: resources
      - path: data/seed-bh.json
        buildPhase: resources
      - path: data/seed-jp.json
        buildPhase: resources
      - path: data/seed-it.json
        buildPhase: resources
      - path: data/map-packs.json
        buildPhase: resources
      - path: data/emergency-kit.json
        buildPhase: resources
      - path: data/hospitals.json
        buildPhase: resources
      - path: Must/Data/checklists/intl-japan.json
        buildPhase: resources
      - path: Must/Data/checklists/domestic-br.json
        buildPhase: resources
      - path: Must/Data/rules/jp-br.json
        buildPhase: resources
      - path: Must/Data/rules/it-br.json
        buildPhase: resources
      - path: Must/Data/areas/tokyo.json
        buildPhase: resources
      - path: Must/Data/areas/kyoto.json
        buildPhase: resources
      - path: Must/Data/areas/bh.json
        buildPhase: resources
      - path: Must/Data/areas/roma.json
        buildPhase: resources
    dependencies:
      - target: MustWidgets
        embed: true
      - target: MustShare
        embed: true
      - package: MapLibre
    postBuildScripts:
      - name: Copiar Secrets.plist (se existir)
        basedOnDependencyAnalysis: false
        script: |
          SRC="${SRCROOT}/Secrets.plist"
          DST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Secrets.plist"
          if [ -f "$SRC" ]; then
            cp "$SRC" "$DST"
            echo "Secrets.plist copiado"
          else
            rm -f "$DST"
            echo "warning: Secrets.plist ausente — serviços ao vivo ficam desligados (ver Secrets.example.plist)"
          fi
    entitlements:
      path: Must/Must.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.viniso.must
    info:
      path: Must/Info.plist
      properties:
        CFBundleDisplayName: Must
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: pt-BR
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Light
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocationWhenInUseUsageDescription: Pra mostrar o que está aberto perto de você
        NSCameraUsageDescription: Pra ler o QR e o código do ingresso
        NSSupportsLiveActivities: true
        MLNIdeographicFontFamilyName: Hiragino Sans
        UIAppFonts:
          - BricolageGrotesque.ttf
          - SchibstedGrotesk.ttf
          - MartianMono.ttf
        CFBundleURLTypes:
          - CFBundleURLName: dev.viniso.must
            CFBundleURLSchemes:
              - must
        LSApplicationQueriesSchemes:
          - comgooglemaps
          - maps
          - whatsapp
        # Quick Action "SOS" (prompt 25 · C.3): toque longo no ícone abre o SOS do país.
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: dev.viniso.must.sos
            UIApplicationShortcutItemTitle: SOS
            UIApplicationShortcutItemSubtitle: números do país, hospital, onde estou
            UIApplicationShortcutItemIconSymbolName: cross.case.fill
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.viniso.must
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO

  MustWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Must/Widgets
      - path: Must/Shared
      - path: Must/Resources/Fonts
        excludes:
          - "licenses/**"
        buildPhase: resources
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
    entitlements:
      path: Must/Widgets/MustWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.viniso.must
    info:
      path: Must/Widgets/Info.plist
      properties:
        CFBundleDisplayName: Must
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - BricolageGrotesque.ttf
          - SchibstedGrotesk.ttf
          - MartianMono.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.viniso.must.widgets
        SKIP_INSTALL: YES

  MustShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Must/ShareExtension
      - path: Must/Services/Tickets/ShareInbox.swift
    dependencies:
      - sdk: UniformTypeIdentifiers.framework
    entitlements:
      path: Must/ShareExtension/MustShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.viniso.must
    info:
      path: Must/ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Must
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 1
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.viniso.must.share
        SKIP_INSTALL: YES

  MustTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MustTests
      - path: data/seed-bh.json
        buildPhase: resources
      - path: data/seed-jp.json
        buildPhase: resources
      - path: data/seed-it.json
        buildPhase: resources
      - path: data/map-packs.json
        buildPhase: resources
    dependencies:
      - target: Must
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.viniso.must.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Must.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Must
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  Must:
    build:
      targets:
        Must: all
        MustWidgets: all
        MustShare: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MustTests
    archive:
      config: Release
