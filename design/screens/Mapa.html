<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Must — Mapa (papel em relevo)</title>

<link rel="stylesheet" href="must-light.css"><style>html,body{background:#EEF0F3}body{display:flex;justify-content:center;padding:24px 0}.app{box-shadow:0 30px 80px rgba(0,0,0,.18);border-radius:44px}</style>
</head>
<body>


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=Instrument+Serif:ital@0;1&amp;family=Geist+Mono:wght@400;600&amp;family=Zen+Kaku+Gothic+New:wght@500;700&amp;display=swap">
<style>
body{margin:0;background:#fff}
.st{font-family:'Archivo',sans-serif;font-size:9px;font-weight:600;letter-spacing:.16em;fill:#9AA0A8;text-transform:uppercase}
.dl{font-family:'Archivo',sans-serif;font-size:10px;font-weight:700;letter-spacing:.22em;fill:#A9AEB6}
.pk{font-family:'Archivo',sans-serif;font-size:9px;font-weight:600;letter-spacing:.14em;fill:#5FAE7E}
.mo{font-family:'Geist Mono',monospace;font-weight:600}
.kj{font-family:'Zen Kaku Gothic New',sans-serif;font-weight:700}
.lg{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#121316;background:rgba(255,255,255,.92);border-radius:999px;padding:6px 10px;box-shadow:0 6px 16px rgba(18,19,22,.18);border:1px solid rgba(255,255,255,.6)}
.lg.off{color:#A9AEB6}
.near{min-width:150px;border-radius:16px;background:#fff;border:1px solid #EEF0F3;padding:10px 12px;display:flex;flex-direction:column;gap:3px;flex-shrink:0;text-decoration:none;color:#121316}
</style>

<div class="app" style="background:#E9EBEF">

  <svg aria-hidden="true" viewBox="0 0 390 844" width="390" height="844" style="position:absolute;inset:0" fill="none">
    <defs>
      <filter id="relief" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#121316" flood-opacity=".14"/></filter>
      <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.2"/></filter>
      <filter id="pin" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity=".35"/></filter>
      <pattern id="pd" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r=".9" fill="#5FAE7E" opacity=".45"/></pattern>
      <pattern id="gr" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" stroke="rgba(18,19,22,.03)" stroke-width="1"/></pattern>
      <radialGradient id="halo"><stop offset="0" stop-color="#2B7BFF" stop-opacity=".35"/><stop offset="1" stop-color="#2B7BFF" stop-opacity="0"/></radialGradient>
      <radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".07"/></radialGradient>
    </defs>
    <rect width="390" height="844" fill="#E9EBEF"/>
    <rect width="390" height="844" fill="url(#gr)"/>

    <!-- parque e água: dessaturados -->
    <path d="M236 292 C 300 262, 400 290, 410 350 L 410 530 C 350 552, 270 530, 240 470 Z" fill="#E1EEE7"/>
    <path d="M236 292 C 300 262, 400 290, 410 350 L 410 530 C 350 552, 270 530, 240 470 Z" fill="url(#pd)"/>
    <ellipse cx="330" cy="400" rx="34" ry="20" fill="#D9E4EF"/>
    <path d="M-10 690 C 90 660, 200 760, 410 700" stroke="#D9E4EF" stroke-width="22" stroke-linecap="round" opacity=".9"/>

    <!-- ruas: fitas (principais) e pontilhado (locais) -->
    <g stroke="#CFD3DB" stroke-width="9" stroke-linecap="round"><path d="M-10 250 L 410 190"/><path d="M60 -10 L 200 860"/></g>
    <g stroke="#DADDE3" stroke-width="5" stroke-linecap="round"><path d="M-10 420 L 240 400"/><path d="M-10 560 L 410 520"/><path d="M310 -10 L 340 300"/><path d="M-10 120 L 300 80"/></g>
    <g stroke="#C9CDD3" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round"><path d="M30 190 L 130 640"/><path d="M-10 330 L 220 310"/><path d="M120 60 L 250 20"/><path d="M160 480 L 230 470"/><path d="M250 560 L 290 840"/></g>

    <!-- quadras em relevo -->
    <g filter="url(#relief)" fill="#F7F8FA">
      <rect x="-14" y="20" width="80" height="70" rx="7"/><rect x="92" y="4" width="110" height="46" rx="7"/><rect x="236" y="-6" width="60" height="60" rx="7"/><rect x="330" y="-10" width="70" height="70" rx="7"/>
      <rect x="-14" y="140" width="56" height="60" rx="7"/><rect x="76" y="140" width="100" height="56" rx="7"/><rect x="212" y="120" width="86" height="80" rx="7"/><rect x="350" y="110" width="60" height="70" rx="7"/>
      <rect x="-14" y="270" width="40" height="60" rx="7"/><rect x="60" y="275" width="110" height="46" rx="7"/><rect x="210" y="240" width="60" height="50" rx="7"/>
      <rect x="-14" y="350" width="130" height="50" rx="7"/><rect x="150" y="350" width="70" height="50" rx="7"/>
      <rect x="-14" y="450" width="150" height="80" rx="7"/><rect x="170" y="440" width="60" height="90" rx="7"/>
      <rect x="-14" y="590" width="100" height="70" rx="7"/><rect x="120" y="590" width="90" height="60" rx="7"/><rect x="232" y="580" width="90" height="60" rx="7"/><rect x="350" y="570" width="70" height="80" rx="7"/>
      <rect x="-14" y="740" width="110" height="60" rx="7"/><rect x="150" y="760" width="80" height="60" rx="7"/><rect x="330" y="740" width="80" height="70" rx="7"/>
    </g>
    <!-- highlight de relevo no topo das quadras -->
    <g stroke="rgba(255,255,255,.9)" stroke-width="1" fill="none">
      <path d="M-7 21 H 59"/><path d="M99 5 H 195"/><path d="M243 -5 H 289"/><path d="M-7 141 H 35"/><path d="M83 141 H 169"/><path d="M219 121 H 291"/><path d="M67 276 H 163"/><path d="M217 241 H 263"/><path d="M-7 351 H 109"/><path d="M157 351 H 213"/><path d="M-7 451 H 129"/><path d="M177 441 H 223"/><path d="M-7 591 H 79"/><path d="M127 591 H 203"/><path d="M239 581 H 315"/><path d="M357 571 H 413"/><path d="M-7 741 H 89"/><path d="M157 761 H 223"/>
    </g>

    <!-- nomes -->
    <text x="84" y="231" class="st" transform="rotate(-8 84 231)">AV. AFONSO PENA</text>
    <text x="24" y="410" class="st" transform="rotate(-4 24 410)">R. DOS TIMBIRAS</text>
    <text x="338" y="196" class="st" transform="rotate(84.5 338 196)">R. DA BAHIA</text>
    <text x="262" y="322" class="pk">PARQUE MUNICIPAL</text>
    <text x="22" y="446" class="dl">LOURDES</text>
    <text x="290" y="760" class="dl">CENTRO</text>

    <!-- metrô fino -->
    <path d="M-10 640 L 140 500 L 400 500" stroke="#0C6DB2" stroke-width="2.5" opacity=".8"/>
    <circle cx="140" cy="500" r="4.5" fill="#fff" stroke="#121316" stroke-width="1.6"/><text x="152" y="520" class="st" style="fill:#121316">CENTRAL</text>

    <!-- rota de hoje em contas: feito sólido, futuro em contas -->
    <path d="M60 220 L 150 330" stroke="#2B7BFF" stroke-width="3.5" stroke-linecap="round" opacity=".9"/>
    <g fill="#2B7BFF"><circle cx="160" cy="344" r="3"/><circle cx="170" cy="358" r="3"/><circle cx="180" cy="372" r="3"/><circle cx="190" cy="386" r="3"/><circle cx="200" cy="400" r="3"/><circle cx="210" cy="414" r="3"/><circle cx="226" cy="442" r="3"/><circle cx="238" cy="460" r="3"/><circle cx="250" cy="478" r="3"/><circle cx="262" cy="496" r="3"/></g>
    <!-- amanhã: linha fina pontilhada clara -->
    <path d="M330 166 L 250 240 L 70 300" stroke="#2B7BFF" stroke-width="1.5" stroke-dasharray="1 6" stroke-linecap="round" opacity=".8"/>

    <!-- você -->
    <circle cx="150" cy="330" r="34" fill="url(#halo)"/>
    <path d="M150 330 L 134 296 A 36 36 0 0 1 166 296 Z" fill="#2B7BFF" opacity=".22"/>
    <circle cx="150" cy="330" r="7.5" fill="#2B7BFF" stroke="#fff" stroke-width="2.5"/>

    <!-- sem plano: carimbos com kanji na cor do Must; aberto = cor cheia + anel -->
    <g filter="url(#pin)">
      <circle cx="222" cy="330" r="11" fill="#fff" stroke="#C9CDD3" stroke-width="1.2"/><text x="222" y="334.5" text-anchor="middle" class="kj" font-size="11" fill="#8B5CF6">観</text>
      <circle cx="30" cy="174" r="11" fill="#22DD7E"/><text x="30" y="178.5" text-anchor="middle" class="kj" font-size="11" fill="#0B2A18">食</text><circle cx="30" cy="174" r="18" stroke="#22DD7E" stroke-width="1.2" opacity=".5"/>
      <circle cx="118" cy="470" r="11" fill="#fff" stroke="#C9CDD3" stroke-width="1.2"/><text x="118" y="474.5" text-anchor="middle" class="kj" font-size="11" fill="#FFB020">買</text>
      <circle cx="196" cy="166" r="11" fill="#2B7BFF"/><text x="196" y="170.5" text-anchor="middle" class="kj" font-size="11" fill="#fff">飲</text><circle cx="196" cy="166" r="18" stroke="#2B7BFF" stroke-width="1.2" opacity=".5"/>
      <circle cx="300" cy="358" r="11" fill="#fff" stroke="#C9CDD3" stroke-width="1.2"/><text x="300" y="362.5" text-anchor="middle" class="kj" font-size="11" fill="#FF4D8D">聴</text>
      <circle cx="40" cy="498" r="11" fill="#fff" stroke="#C9CDD3" stroke-width="1.2"/><text x="40" y="502.5" text-anchor="middle" class="kj" font-size="11" fill="#22DD7E">食</text>
    </g>
    <!-- amanhã -->
    <g filter="url(#pin)">
      <circle cx="330" cy="166" r="12" fill="#fff" stroke="#2B7BFF" stroke-width="1.5" stroke-dasharray="3 2"/><text x="330" y="170" text-anchor="middle" class="mo" font-size="10" fill="#2B7BFF">1</text>
      <circle cx="250" cy="240" r="12" fill="#fff" stroke="#2B7BFF" stroke-width="1.5" stroke-dasharray="3 2"/><text x="250" y="244" text-anchor="middle" class="mo" font-size="10" fill="#2B7BFF">2</text>
      <circle cx="70" cy="300" r="12" fill="#fff" stroke="#2B7BFF" stroke-width="1.5" stroke-dasharray="3 2"/><text x="70" y="304" text-anchor="middle" class="mo" font-size="10" fill="#2B7BFF">3</text>
    </g>
    <!-- hoje -->
    <g filter="url(#pin)">
      <circle cx="60" cy="220" r="14" fill="#22DD7E"/><text x="60" y="225" text-anchor="middle" class="kj" font-size="12" fill="#0B2A18">済</text>
      <circle cx="280" cy="520" r="14" fill="#fff" stroke="#121316" stroke-width="1.6"/><text x="280" y="524" text-anchor="middle" class="mo" font-size="11" fill="#121316">4</text>
      <circle cx="215" cy="430" r="17" fill="#121316"/><text x="215" y="434.5" text-anchor="middle" class="mo" font-size="12" fill="#fff">3</text>
    </g>
    <g><rect x="236" y="418" width="124" height="24" rx="12" fill="#121316"/><text x="298" y="434" text-anchor="middle" font-family="Archivo" font-size="11" font-weight="600" fill="#fff">Inimá · 14 min a pé</text></g>

    <rect width="390" height="844" fill="url(#vig)" style="pointer-events:none"/>
    <path d="M24 532 L 24 540 L 104 540 L 104 532" stroke="#121316" stroke-width="1.4"/><text x="64" y="528" text-anchor="middle" class="mo" font-size="10" fill="#121316">300 m</text>
  </svg>

  <div style="position:absolute;left:22px;right:22px;top:58px;display:flex;gap:8px;align-items:center">
    <label class="glass" style="flex:1;height:44px;border-radius:999px;display:flex;align-items:center;gap:8px;padding:0 14px;box-sizing:border-box;cursor:text;background:rgba(255,255,255,.92)"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7A7F87" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg><input type="text" placeholder="Centro · 6 musts a 500 m · 2 abertos" style="flex:1;background:transparent;border:0;outline:0;font-family:'Archivo',sans-serif;font-size:14px;color:#121316;min-width:0"></label>
    <button class="ic" aria-label="Assistente" style="background:#22DD7E;color:#0B2A18;box-shadow:0 6px 16px rgba(18,19,22,.25)"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.6L18 9l-4.2 1.4L12 15l-1.8-4.6L6 9l4.2-1.4z"/></svg></button>
  </div>

  <div style="position:absolute;left:22px;right:22px;top:112px;display:flex;gap:6px;flex-wrap:wrap">
    <button class="lg"><span style="width:12px;height:12px;border-radius:50%;background:#121316;color:#fff;font-family:'Geist Mono',monospace;font-size:8px;display:flex;align-items:center;justify-content:center">3</span>Hoje</button>
    <button class="lg"><span style="width:12px;height:12px;border-radius:50%;border:1.5px dashed #2B7BFF;box-sizing:border-box"></span>Amanhã</button>
    <button class="lg"><span class="kj" style="font-size:10px;color:#22DD7E">食</span>Sem plano</button>
    <button class="lg off">済 Feitos</button>
  </div>

  <div style="position:absolute;right:22px;bottom:300px;display:flex;flex-direction:column;gap:8px">
    <button class="ic" aria-label="Centralizar" style="background:rgba(255,255,255,.92);box-shadow:0 6px 16px rgba(18,19,22,.25)"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><circle cx="12" cy="12" r="8"/></svg></button>
    <button class="ic" aria-label="Escala de bairro" style="background:rgba(255,255,255,.92);box-shadow:0 6px 16px rgba(18,19,22,.25)"><span class="mono" style="font-size:10px;font-weight:600">300</span></button>
  </div>

  <div class="card" style="position:absolute;left:22px;right:22px;bottom:96px;padding:14px 0;display:flex;flex-direction:column;gap:12px;background:rgba(255,255,255,.96);box-shadow:0 20px 50px rgba(0,0,0,.35)">
    <div style="display:flex;justify-content:space-between;align-items:baseline;padding:0 16px"><span class="micro">Perto de você · 500 m</span><span style="font-size:12px;color:#7A7F87">2 abertos</span></div>
    <div style="display:flex;gap:8px;overflow:hidden;padding:0 16px">
      <a href="Lugar.html" class="near"><span style="display:flex;align-items:center;gap:6px"><span class="kj" style="font-size:11px;color:#2B7BFF">飲</span><span style="font-size:14px;font-weight:600">Café Nice</span></span><span style="font-size:12px;color:#7A7F87"><span style="color:#0B5A33;font-weight:600">aberto</span> · 180 m</span></a>
      <a href="Lugar.html" class="near"><span style="display:flex;align-items:center;gap:6px"><span class="kj" style="font-size:11px;color:#22DD7E">食</span><span style="font-size:14px;font-weight:600">Mercado Central</span></span><span style="font-size:12px;color:#7A7F87"><span style="color:#0B5A33;font-weight:600">aberto</span> · 420 m</span></a>
      <a href="Lugar.html" class="near"><span style="display:flex;align-items:center;gap:6px"><span class="kj" style="font-size:11px;color:#8B5CF6">観</span><span style="font-size:14px;font-weight:600">Inimá de Paula</span></span><span style="font-size:12px;color:#7A7F87">abre 13:00 · 470 m</span></a>
    </div>
    <div style="border-top:1px solid #EEF0F3;margin:0 16px"></div>
    <a href="Lugar.html" style="display:flex;align-items:center;gap:12px;padding:0 16px;text-decoration:none;color:#121316">
      <span style="width:34px;height:34px;border-radius:50%;background:#121316;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Geist Mono',monospace;font-size:13px;font-weight:600">3</span>
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-size:17px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Museu Inimá de Paula</span><span style="font-size:12.5px;color:#7A7F87"><span class="mono" style="color:#121316;font-weight:600">14:30</span> · 14 min a pé</span></div>
      <span class="pill pill-green" style="padding:7px 11px">saia 14:11</span>
    </a>
  </div>

    <a href="Hoje.html" class="tab"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Hoje</a>

</div>
