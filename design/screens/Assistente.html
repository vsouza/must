<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Must — Assistente (claro)</title>

<link rel="stylesheet" href="must-light.css"><style>html,body{background:#EEF0F3}body{display:flex;justify-content:center;padding:24px 0}.app{box-shadow:0 30px 80px rgba(0,0,0,.18);border-radius:44px}</style>
</head>
<body>


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=Instrument+Serif:ital@0;1&amp;family=Geist+Mono:wght@400;600&amp;family=Zen+Kaku+Gothic+New:wght@500;700&amp;display=swap">
<style>body{margin:0;background:#fff}</style>

<div class="app">
  <svg aria-hidden="true" viewBox="0 0 390 420" width="390" height="420" style="position:absolute;left:0;top:120px">
    <defs>
      <pattern id="d" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.3" fill="#121316"/></pattern>
      <linearGradient id="o1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9FD6FF"/><stop offset="1" stop-color="#2B7BFF"/></linearGradient>
      <linearGradient id="o2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B9F5CF"/><stop offset="1" stop-color="#22DD7E"/></linearGradient>
      <filter id="w" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency=".012" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="30" xChannelSelector="R" yChannelSelector="G"/></filter>
      <mask id="mk"><circle cx="195" cy="170" r="104" fill="#fff" filter="url(#w)"/></mask>
    </defs>
    <ellipse cx="150" cy="150" rx="110" ry="90" fill="url(#o1)" opacity=".95" transform="rotate(-20 150 150)"/>
    <ellipse cx="250" cy="200" rx="100" ry="80" fill="url(#o2)" opacity=".9" transform="rotate(15 250 200)"/>
    <g mask="url(#mk)"><rect x="60" y="40" width="270" height="260" fill="url(#d)" opacity=".55"/></g>
  </svg>

  <div style="position:absolute;left:22px;right:22px;top:58px;display:flex;justify-content:space-between;align-items:flex-start">
    <div style="display:flex;flex-direction:column;gap:2px"><span class="sec" style="font-size:15px">Must</span><span style="font-size:20px;font-weight:600;letter-spacing:-.01em">Assistente</span></div>
    <a href="HomeClaro.html" class="ic" aria-label="Fechar"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
  </div>

  <div style="position:absolute;left:22px;right:22px;top:470px;text-align:center;display:flex;flex-direction:column;gap:6px">
    <span style="font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.05">Como posso ajudar<br>agora, Vinicius?</span>
    <span class="serif" style="font-size:16px;color:#7A7F87">no aparelho · conhece seus 92 musts e o dia de hoje</span>
  </div>

  <div style="position:absolute;left:22px;right:22px;top:570px;display:flex;flex-direction:column;gap:8px;align-items:flex-start">
    <button class="pill">O que está aberto perto de mim?</button>
    <a href="Chat.html" class="pill" style="text-decoration:none">Troca o almoço por algo mais barato</a>
    <button class="pill">Quanto gastei hoje?</button>
    <button class="pill">Qual o último metrô pra casa?</button>
  </div>

  <div style="position:absolute;left:22px;right:22px;bottom:24px;height:60px;border-radius:18px;display:flex;align-items:center;gap:10px;padding:0 8px;box-sizing:border-box;background:#F1F2F4">
    <div style="width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#2B7BFF,#22DD7E);display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.6L18 9l-4.2 1.4L12 15l-1.8-4.6L6 9l4.2-1.4z"/></svg></div>
    <input type="text" placeholder="Pergunte ou peça uma troca…" style="flex:1;background:transparent;border:0;outline:0;color:#121316;font-family:'Archivo',sans-serif;font-size:15px;min-width:0">
    <button class="ic" aria-label="Colar link" style="width:44px;height:44px;border-radius:12px;background:#fff"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg></button>
    <button class="ic ic-dark" aria-label="Falar" style="width:44px;height:44px;border-radius:12px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 10v4M9 7v10M12 4v16M15 8v8M19 10v4"/></svg></button>
  </div>
</div>

</body>
</html>
